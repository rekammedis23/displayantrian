<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Display Antrian Live - RS SS Medika</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/drezmey/simpatik/refs/heads/main/icon-simpatik.png">   
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/drezmey/simpatik/refs/heads/main/icon-simpatik.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    body { 
      font-family: 'Public Sans', sans-serif; 
      background-color: #f0f0f0; 
      height: 100vh;
      margin: 0;
      padding: 15px; 
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    .neo-box {
      border: 4px solid #000;
      box-shadow: 6px 6px 0px 0px #000;
      background: white;
    }

    .header-box {
      height: 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 25px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 20px;
      flex: 1;
      min-height: 0;
    }

    .video-container {
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .video-frame {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
    }
    .video-frame iframe {
      position: absolute; width: 100%; height: 100%; top: 0; left: 0;
    }

    #antrianBoard {
      position: relative;
      background: #fff;
      border: 4px solid #000;
      box-shadow: 8px 8px 0px 0px #000;
      overflow: hidden;
      display: flex;
    }

    .card-dokter {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-around; 
      align-items: center;
      background: #22c55e;
      color: white;
      text-align: center;
      padding: 30px 15px;
      opacity: 0;
      transform: scale(0.95);
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      visibility: hidden;
    }

    .card-dokter.active { 
      opacity: 1; 
      transform: scale(1); 
      visibility: visible; 
      z-index: 10; 
    }

    .nama-dokter { 
      font-size: clamp(1.5rem, 4vh, 2.5rem); 
      font-weight: 900; 
      line-height: 1.2; 
      width: 100%;
      padding: 10px;
      border-bottom: 4px solid rgba(255,255,255,0.3);
    }

    .label-antrian { 
      font-size: clamp(1rem, 2vh, 1.4rem); 
      font-weight: 700; 
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 10px;
    }

    .number-display { 
      font-size: clamp(4rem, 15vh, 10rem); 
      font-weight: 900; 
      line-height: 0.9; 
      text-shadow: 6px 6px 0px #000; 
      margin: 10px 0;
    }

    .btn-masuk { 
      font-size: clamp(1rem, 2.5vh, 1.8rem); 
      border: 4px solid #000; 
      padding: 12px 30px; 
      box-shadow: 5px 5px 0px #000; 
      font-weight: 900;
      background: white;
      color: #16a34a;
      margin-top: 10px;
    }

    .marquee-container {
      margin-top: 20px;
      height: 60px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }

    @media (max-width: 768px) {
      body { overflow-y: auto; height: auto; }
      .main-layout { grid-template-columns: 1fr; display: flex; flex-direction: column; }
      .video-container { height: 250px; flex: none; }
      #antrianBoard { height: 450px; flex: none; }
      .nama-dokter { font-size: 1.5rem; }
      .number-display { font-size: 6rem; }
    }
  </style>
</head>
<body>

  <div class="header-box neo-box bg-yellow-400">
    <h1 class="text-2xl font-black uppercase tracking-tighter">RS SS Medika</h1>
    <div id="clock" class="text-2xl font-black">00:00:00</div>
  </div>

  <div class="main-layout">
    <div class="video-container">
      <div class="video-frame neo-box">
        <div class="absolute top-2 left-2 z-50 opacity-50 hover:opacity-100">
          <select id="channelSelector" onchange="changeChannel()" class="bg-black text-white text-xs p-1 font-bold border-2 border-white rounded">
              <option value="yt_default">YouTube (Default)</option>
              <option value="https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGcmN0aSUyRmluZXdzaWQmaGVpZ2h0PTEwMCUyNSZ3aWR0aD0xMDAlMjU=">RCTI</option>
              <option value="https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGZ3R2JTJGaW5ld3NpZCZoZWlnaHQ9MTAwJTI1JndpZHRoPTEwMCUyNQ==">GTV</option>
              <option value="https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGbW5jdHYlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1">MNCTV</option>
              <option value="https://20.detik.com/watch/livestreaming-transtv">TRANS TV</option>
              <option value="https://20.detik.com/watch/livestreaming-trans7">TRANS 7</option>
              <option value="https://sindikasi.inews.id/embed/video/YWdlbnQ9ZGVza3RvcCZ1cmw9aHR0cHMlM0ElMkYlMkZlbWJlZC5yY3RpcGx1cy5jb20lMkZsaXZlJTJGaW5ld3MlMkZpbmV3c2lkJmhlaWdodD0xMDAlMjUmd2lkdGg9MTAwJTI1">iNews</option>
              <option value="https://www.cnnindonesia.com/tv/embed?ref=transmedia">CNN</option>
          </select>
        </div>
        <iframe id="videoPlayer" src="https://www.youtube.com/embed/Vf4HfpPTuB8?autoplay=1&mute=1&loop=1&playlist=Vf4HfpPTuB8" frameborder="0" allow="autoplay; encrypted-media; fullscreen"></iframe>
      </div>
    </div>

    <div id="antrianBoard">
      <div class="card-dokter active" style="background: white; color: #000;">
        <i class="fa-solid fa-circle-info text-4xl mb-4 text-blue-600"></i>
        <h2 class="nama-dokter font-black uppercase" style="border:none">Antrian Belum Dimulai</h2>
        <p class="text-sm font-bold text-gray-400 animate-pulse uppercase tracking-widest">Menunggu Data Dari Server...</p>
      </div>
    </div>
  </div>

  <div class="marquee-container neo-box bg-blue-600 text-white">
    <marquee class="text-2xl font-black uppercase">Selamat Datang di RS SS Medika • Harap Menunggu Antrian Anda • Semoga Lekas Sembuh</marquee>
  </div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbz1NimF8Y9P4tI1u8wK_nK5abX6EI0yF3kY63ywlF38oeh-58jc6-rTHXAB7ry0sVfg/exec"; 

    // === STATE MANAGEMENT ===
    let currentIndex = 0;
    let antrianData = [];
    let rotationInterval;
    
    // === ANTI-FLICKER CONFIG ===
    let emptyResponseCount = 0;           // Hitung response kosong berturut-turut
    const EMPTY_CONFIRM_THRESHOLD = 3;    // Tampilkan "empty" hanya setelah 3x response kosong
    let lastValidData = null;             // Cache data terakhir yang valid
    let lastRenderedSignature = null;     // Signature data untuk deteksi perubahan
    let hasReceivedValidData = false;     // Flag: pernah terima data valid?
    let rotationStartTime = null;         // Waktu mulai rotasi untuk minimum display time
    const MIN_CARD_DISPLAY_TIME = 8000;   // Minimal 8 detik per card sebelum bisa ganti

    // Generate signature unik untuk deteksi perubahan data
    function getDataSignature(data) {
      if (!data || data.length === 0) return 'empty';
      return data.map(d => `${d.dokter?.trim()}:${d.no_antrian?.trim()}`).sort().join('|');
    }

    async function updateDisplay() {
      try {
        const response = await fetch(`${GAS_URL}?action=getAntrianDisplay`, { 
          cache: 'no-store',
          headers: { 'Cache-Control': 'no-cache' }
        });
        
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const result = await response.json();
        
        if (result.success) {
          const data = result.data;
          const currentSignature = getDataSignature(data);
          
          // === HANDLE EMPTY DATA DENGAN KONFIRMASI ===
          if (!data || data.length === 0) {
            emptyResponseCount++;
            
            // Hanya tampilkan empty state jika sudah terkonfirmasi (bukan glitch sesaat)
            if (emptyResponseCount >= EMPTY_CONFIRM_THRESHOLD) {
              // Jika sebelumnya ada data valid, jangan langsung hapus - beri jeda
              if (hasReceivedValidData && lastValidData?.length > 0) {
                // Masih tampilkan data terakhir selama beberapa cycle lagi
                return;
              }
              // Baru tampilkan empty state jika benar-benar confirmed
              antrianData = [];
              lastValidData = null;
              hasReceivedValidData = false;
              renderEmpty();
              stopRotation();
            }
            return; // Jangan re-render jika belum confirmed empty
          }
          
          // === RESET COUNTER SAAT DAPAT DATA VALID ===
          emptyResponseCount = 0;
          lastValidData = data;
          hasReceivedValidData = true;
          
          // === ANTI-FLICKER: Hanya re-render jika data benar-benar berubah ===
          if (currentSignature !== lastRenderedSignature) {
            antrianData = data;
            lastRenderedSignature = currentSignature;
            renderCards();
            startRotation();
          }
          // Jika signature sama, tidak perlu re-render (hindari flicker)
          
        }
      } catch (err) {
        console.error("Gagal memuat antrian:", err);
        
        // === HANDLE ERROR KONEKSI ===
        emptyResponseCount++;
        
        // Jangan tampilkan error/empty jika sebelumnya sudah ada data valid
        if (emptyResponseCount >= EMPTY_CONFIRM_THRESHOLD && !hasReceivedValidData) {
          renderStandbyError();
          stopRotation();
        }
        // Jika sudah pernah dapat data valid, tetap tampilkan data terakhir (graceful degradation)
      }
    }

    function renderStandbyError() {
      const board = document.getElementById('antrianBoard');
      stopRotation();
      board.innerHTML = `
        <div class="card-dokter active" style="background: white; color: #000;">
          <i class="fa-solid fa-wifi text-6xl mb-4 text-red-400"></i>
          <h2 class="nama-dokter font-black uppercase" style="border:none">Koneksi Terputus</h2>
          <p class="label-antrian text-gray-400 font-bold animate-pulse">Mencoba menghubungkan kembali...</p>
        </div>`;
    }

    function renderEmpty() {
      const board = document.getElementById('antrianBoard');
      stopRotation();
      
      // Hindari re-render jika sudah dalam state empty
      if (board.querySelector('.empty-state')) return;
      
      board.innerHTML = `
        <div class="card-dokter active empty-state" style="background: white; color: #000;">
          <i class="fa-solid fa-hospital-user text-6xl mb-4 text-gray-300"></i>
          <h2 class="nama-dokter font-black uppercase" style="border:none">Antrian Belum Dimulai</h2>
          <p class="label-antrian text-gray-400 font-bold uppercase tracking-widest">Petugas belum memanggil pasien</p>
        </div>`;
    }

    function renderCards() {
      const board = document.getElementById('antrianBoard');
      
      // Hindari re-render jika data sama dan cards sudah ada
      const existingCards = board.querySelectorAll('.card-dokter:not(.empty-state)');
      if (existingCards.length === antrianData.length && lastRenderedSignature) {
        // Update content saja tanpa re-build DOM jika memungkinkan
        antrianData.forEach((item, index) => {
          const card = document.getElementById(`card-${index}`);
          if (card) {
            card.querySelector('.nama-dokter').textContent = item.dokter?.toUpperCase() || '';
            card.querySelector('.number-display').textContent = item.no_antrian || '';
          }
        });
        return;
      }
      
      // Build fresh cards hanya jika benar-benar perlu
      let html = '';
      antrianData.forEach((item, index) => {
        html += `
          <div class="card-dokter" id="card-${index}">
            <h2 class="nama-dokter uppercase">${item.dokter?.toUpperCase() || '-'}</h2>
            <div>
               <p class="label-antrian">Nomor Antrian</p>
               <div class="number-display">${item.no_antrian || '-'}</div>
            </div>
            <div class="btn-masuk">SILAHKAN MASUK</div>
          </div>`;
      });
      board.innerHTML = html;
    }

    function startRotation() {
      stopRotation(); // Pastikan interval lama dihentikan dulu
      
      if (antrianData.length === 0) return;
      
      currentIndex = 0;
      rotationStartTime = Date.now();
      showCard(0);
      
      // Hanya mulai rotasi jika ada lebih dari 1 card
      if (antrianData.length > 1) {
        rotationInterval = setInterval(() => {
          // Pastikan card sudah ditampilkan minimal MIN_CARD_DISPLAY_TIME
          const elapsed = Date.now() - rotationStartTime;
          if (elapsed < MIN_CARD_DISPLAY_TIME) return;
          
          hideCard(currentIndex);
          currentIndex = (currentIndex + 1) % antrianData.length;
          rotationStartTime = Date.now();
          showCard(currentIndex);
        }, 1000); // Cek setiap 1 detik, tapi hanya ganti card setelah minimal time terpenuhi
      }
    }

    function stopRotation() {
      if (rotationInterval) {
        clearInterval(rotationInterval);
        rotationInterval = null;
      }
      rotationStartTime = null;
    }

    function showCard(index) {
      const el = document.getElementById(`card-${index}`);
      if (el) {
        el.classList.add('active');
        // Pastikan card lain tidak active
        document.querySelectorAll('.card-dokter').forEach(c => {
          if (c.id !== `card-${index}`) c.classList.remove('active');
        });
      }
    }

    function hideCard(index) {
      const el = document.getElementById(`card-${index}`);
      if (el) el.classList.remove('active');
    }

    function changeChannel() {
      const selector = document.getElementById('channelSelector');
      const player = document.getElementById('videoPlayer');
      const val = selector.value;
      // Preserve autoplay & mute settings
      if (val === 'yt_default') {
        player.src = "https://www.youtube.com/embed/Vf4HfpPTuB8?autoplay=1&mute=1&loop=1&playlist=Vf4HfpPTuB8";
      } else {
        player.src = val;
      }
    }

    // === INITIALIZATION ===
    updateDisplay();
    setInterval(updateDisplay, 15000); // Polling setiap 15 detik
    
    // Clock update
    setInterval(() => {
      const clock = document.getElementById('clock');
      if (clock) clock.innerText = new Date().toLocaleTimeString('id-ID');
    }, 1000);
    
    // Handle page visibility untuk pause rotation saat tab tidak aktif (hemat resource)
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        stopRotation();
      } else if (antrianData.length > 0) {
        startRotation();
      }
    });
  </script>
</body>
</html>
